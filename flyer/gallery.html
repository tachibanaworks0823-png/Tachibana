<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ハロウィン コスプレ フライヤー サンプル20</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #12080a;
      --panel: #1c0c10;
      --gold: #d4a84b;
      --cream: #f3e6d4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Shippori Mincho", serif;
      background:
        radial-gradient(ellipse 80% 40% at 50% 0%, #3a1218, transparent 60%),
        var(--bg);
      color: var(--cream);
      padding: 2rem 1.25rem 3rem;
    }
    header {
      max-width: 1100px;
      margin: 0 auto 1.75rem;
      text-align: center;
    }
    header h1 {
      font-size: clamp(1.4rem, 4vw, 2rem);
      letter-spacing: 0.12em;
      color: var(--gold);
    }
    header p {
      margin-top: 0.75rem;
      letter-spacing: 0.08em;
      opacity: 0.85;
      line-height: 1.7;
    }
    .grid {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.25rem;
    }
    figure {
      background: var(--panel);
      outline: 1px solid rgba(212, 168, 75, 0.28);
    }
    figure a { display: block; }
    figure img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 3 / 4;
      object-fit: cover;
    }
    figcaption {
      padding: 0.55rem 0.6rem 0.7rem;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-align: center;
      color: var(--gold);
    }
  </style>
</head>
<body>
  <header>
    <h1>HALLOWEEN COSPLAY — 20 SAMPLES</h1>
    <p>
      イベント：コスプレ<br />
      文言：仮装で盛り上がる特別な2日間<br />
      日程：10/30・10/31
    </p>
  </header>
  <div class="grid" id="grid"></div>
  <script>
    const grid = document.getElementById("grid");
    for (let i = 1; i <= 20; i++) {
      const n = String(i).padStart(2, "0");
      const fig = document.createElement("figure");
      fig.innerHTML = `
        <a href="samples/halloween-sample-${n}.jpg" target="_blank" rel="noopener">
          <img src="samples/halloween-sample-${n}.jpg" alt="Halloween flyer sample ${n}" loading="lazy" />
        </a>
        <figcaption>SAMPLE ${n}</figcaption>
      `;
      grid.appendChild(fig);
    }
  </script>
</body>
</html>
