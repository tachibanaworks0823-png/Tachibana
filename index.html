<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tachibana — モエシリーズ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Zen+Old+Mincho:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="stage" id="stage" aria-live="polite">
      <!-- モエシリーズ -->
      <section class="slide slide--champagne is-active" data-slide="0">
        <div class="slide__atmosphere slide__atmosphere--champagne"></div>
        <div class="slide__veil"></div>
        <div class="slide__content">
          <header class="slide__header">
            <p class="slide__eyebrow">MOËT &amp; CHANDON</p>
            <h2 class="slide__title">モエシリーズ</h2>
            <p class="slide__lead">ボトルで祝う、今夜の特別。</p>
          </header>
          <ul class="menu">
            <li class="menu__item">
              <span class="menu__name">モエシロ</span>
              <span class="menu__dots" aria-hidden="true"></span>
              <span class="menu__price">¥20,000</span>
            </li>
            <li class="menu__item">
              <span class="menu__name">モエロゼ</span>
              <span class="menu__dots" aria-hidden="true"></span>
              <span class="menu__price">¥25,000</span>
            </li>
            <li class="menu__item">
              <span class="menu__name">モエ黒</span>
              <span class="menu__dots" aria-hidden="true"></span>
              <span class="menu__price">¥30,000</span>
            </li>
            <li class="menu__item">
              <span class="menu__name">モエアイス</span>
              <span class="menu__dots" aria-hidden="true"></span>
              <span class="menu__price">¥35,000</span>
            </li>
            <li class="menu__item menu__item--featured">
              <span class="menu__name">モエピカ</span>
              <span class="menu__dots" aria-hidden="true"></span>
              <span class="menu__price">¥40,000</span>
            </li>
          </ul>
        </div>
      </section>
    </div>

    <div class="chrome" aria-hidden="true">
      <div class="progress">
        <div class="progress__bar" id="progressBar"></div>
      </div>
      <div class="dots" id="dots"></div>
      <p class="hint">Space で一時停止 · F で全画面</p>
    </div>

    <script src="app.js"></script>
  </body>
</html>
